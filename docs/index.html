<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>다이제스트 설정</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Cpath d='M14 31 50 16 40 49l-9-10-4 9-2-12z' fill='%23fff'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <div>
    <h1>다이제스트 설정</h1>
    <div class="sub">studioditto-ctrl/lookbook · <span id="build"></span></div>
  </div>
  <div class="row" style="gap:8px">
    <button id="statusPill" class="tiny" onclick="setMode('settings')" hidden></button>
    <div id="saveState">불러오는 중…</div>
  </div>
</header>

<div id="shell">
<aside id="sidebar">
  <nav id="topicNav" class="navlist"></nav>
  <button class="tiny wide dashed nav-wizard-btn" onclick="setMode('wizard')">＋ 새 주제</button>
  <div class="divider"></div>
  <button class="tiny wide ghost nav-settings-btn" onclick="setMode('settings')">⚙ 공통 설정</button>
</aside>

<!-- 가운데 단. 데스크탑에서만, 주제 목록 화면일 때만 쓴다 — 고른 주제 안에서
     무엇을 보고 있는지 (발송 일정 / 키워드 / 검색 범위 / 소스 / 주제 삭제)
     여기서 고른다. -->
<aside id="sectionNav"></aside>

<main>
  <!-- 모바일 전용 — 사이드바가 안 보일 때 새 주제/공통 설정으로 가는 유일한 길 -->
  <div class="row" id="modeBarMobile" style="gap:8px; margin-bottom:12px">
    <button class="tiny dashed nav-wizard-btn" style="flex:1" onclick="setMode('wizard')">＋ 새 주제</button>
    <button class="tiny ghost nav-settings-btn" style="flex:1" onclick="setMode('settings')">⚙ 공통 설정</button>
  </div>

  <!-- 주제 목록: 기존 3단 드릴다운 화면 -->
  <div id="topicsView">
    <div id="digests"></div>
  </div>

  <!-- 새 주제 만들기: 테마 입력 → AI 추천 → 채널/키워드 선택 →
       자동세팅 완료 → 실행 조건 → 테스트 → 실행 순서의 마법사 -->
  <div id="wizardView" hidden></div>

  <!-- 공통 설정: 토큰 · 다른 기기에서 쓰기 · 구독 채널 가져오기 · 제외어 등
       주제마다 반복되지 않는 것들을 한데 모은다 -->
  <div id="settingsView" hidden>
    <h2 style="margin:4px 0 14px">공통 설정</h2>
    <div id="tokenCard"></div>
    <div id="driveSetup"></div>
    <div class="card">
      <h2>필터 기본값</h2>
      <div class="sub">모든 주제에 똑같이 적용됩니다. 주제별로 따로 정한 값(예: 검색 범위 화면의
        보관 기간)이 있으면 그쪽이 우선합니다.</div>
      <div class="filterGrid">
        <div>
          <label>최근 몇 시간 이내 글만</label>
          <input id="fltLookback" type="number" min="1" step="1" inputmode="numeric"
                 onchange="setFilter('lookback_hours', this.value)">
        </div>
        <div>
          <label>유튜브 최소 구독자 <span class="sub">(직접 등록한 채널은 면제)</span></label>
          <input id="fltMinSubs" type="number" min="0" step="100" inputmode="numeric"
                 onchange="setFilter('min_subscribers', this.value)">
        </div>
        <div>
          <label>유튜브 최소 조회수</label>
          <input id="fltMinViews" type="number" min="0" step="100" inputmode="numeric"
                 onchange="setFilter('min_views', this.value)">
        </div>
      </div>
      <div class="note" id="filterNote"></div>
    </div>
    <div class="card">
      <h2>내 구독 채널 (Google Drive)</h2>
      <div class="sub" id="subsInfo">아직 불러오지 않았습니다.</div>
      <div id="driveBox"></div>
    </div>
    <div class="card">
      <h2>공통 제외어</h2>
      <div class="sub">제목에 이 단어가 있으면 어느 주제든 보내지 않습니다.</div>
      <div class="chips" id="excludeChips"></div>
      <div class="add">
        <input id="excludeInput" placeholder="예: 협찬" enterkeyhint="done"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addExclude()}">
        <button class="tiny" onclick="addExclude()">추가</button>
      </div>
    </div>
    <div class="card">
      <h2>즐겨찾기에 두기</h2>
      <div class="note" id="bookmarkHelp"></div>
    </div>
  </div>
</main>
</div>

<div class="toast" id="toast"></div>

<footer>
  <button class="ghost" id="reloadBtn" onclick="load()">새로고침</button>
  <button class="primary" id="saveBtn" onclick="save()">저장</button>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
