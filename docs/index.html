<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>다이제스트 설정</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#14171a; --muted:#667085; --line:#e4e7ec;
    --accent:#1f6feb; --accent-ink:#fff; --danger:#c0392b; --ok:#0f7b3f;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1115; --card:#171a21; --ink:#e8eaed; --muted:#98a2b3;
           --line:#272b33; --accent:#4a8bff; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; overscroll-behavior-y:contain}
  body{
    background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    padding:0 0 92px; -webkit-text-size-adjust:100%;
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  h1{font-size:18px; margin:0}
  .sub{color:var(--muted); font-size:13px}
  #saveState{font-size:13px; color:var(--muted); text-align:right; white-space:nowrap}
  #saveState.busy{color:var(--accent)}
  #saveState.dirty{color:var(--danger)}
  main{padding:14px 16px; max-width:560px; margin:0 auto}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
        padding:14px; margin-bottom:12px}
  .card h2{font-size:16px; margin:0 0 4px}
  .row{display:flex; gap:10px; align-items:center}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px}
  input{
    width:100%; padding:11px 12px; font-size:16px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
  }
  input[type=time]{font-variant-numeric:tabular-nums}
  button{
    font:inherit; font-size:15px; padding:10px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    cursor:pointer; min-height:44px;
  }
  button:disabled{opacity:.5}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
  button.ghost{background:transparent}
  button.tiny{min-height:38px; padding:6px 12px; font-size:14px}
  button.wide{width:100%; margin-top:10px}

  .slot{border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px}
  .slot .head{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .slot .head input.title{flex:1; padding:8px 10px; font-size:15px; font-weight:600}
  button.danger{color:var(--danger)}
  button.dashed{border-style:dashed; color:var(--muted)}
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .step{display:flex; align-items:center; background:var(--bg);
        border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .step button{flex:0 0 38px; min-height:42px; padding:0; border:0; background:none;
        color:var(--accent); font-size:20px; line-height:1}
  .step span{flex:1; text-align:center; font-variant-numeric:tabular-nums}

  /* 켜기/끄기 스위치 */
  .sw{position:relative; flex:0 0 50px; height:30px}
  .sw input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0}
  .sw i{position:absolute; inset:0; border-radius:999px; background:var(--line); transition:.15s}
  .sw i::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px;
        border-radius:50%; background:#fff; transition:.15s}
  .sw input:checked + i{background:var(--accent)}
  .sw input:checked + i::after{transform:translateX(20px)}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .chip{display:inline-flex; align-items:center; gap:4px; padding:6px 6px 6px 12px;
        background:var(--bg); border:1px solid var(--line); border-radius:999px; font-size:14px}
  .chip.plain{padding-right:12px}
  .chip button{border:0; background:none; padding:0; min-height:28px; width:28px;
        color:var(--muted); font-size:18px; line-height:1}
  .add{display:flex; gap:8px; margin-top:10px}
  .add input{flex:1}
  details{margin-top:12px}
  details > summary{cursor:pointer; font-size:14px; color:var(--muted);
        padding:10px 0; list-style:none; display:flex; justify-content:space-between}
  details > summary::-webkit-details-marker{display:none}
  details > summary::after{content:"▾"; transition:.15s}
  details[open] > summary::after{transform:rotate(180deg)}

  footer{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); display:flex; gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  footer button{flex:1}
  /* 눌렀는지 항상 보이도록 화면 아래에 띄운다 — 스크롤 위치와 무관하게 */
  .toast{
    position:fixed; left:12px; right:12px; z-index:20; display:none;
    bottom:calc(74px + env(safe-area-inset-bottom));
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; font-size:14px; box-shadow:0 8px 28px rgba(0,0,0,.22);
  }
  .toast.show{display:block}
  .toast.ok{border-color:var(--ok); color:var(--ok)}
  .toast.err{border-color:var(--danger); color:var(--danger)}
  .toast.busy{border-color:var(--accent); color:var(--accent)}
  .toast a{color:var(--accent)}
  .note{font-size:13px; color:var(--muted); margin-top:8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>다이제스트 설정</h1>
    <div class="sub">studioditto-ctrl/lookbook</div>
  </div>
  <div id="saveState">불러오는 중…</div>
</header>

<main>
  <div id="tokenCard"></div>

  <!-- 맨 위: 주제 추가 -->
  <div class="card">
    <h2>주제 추가</h2>
    <div class="sub">넣은 말로 구글 뉴스를 찾고, 불러온 구독 목록에서 이름이 맞는 채널을 붙입니다.</div>
    <div class="add">
      <input id="newTopic" placeholder="예: 커피" enterkeyhint="done"
             autocapitalize="off" autocomplete="off"
             onkeydown="if(event.key==='Enter'){event.preventDefault();addTopic()}">
      <button class="primary" onclick="addTopic()">만들기</button>
    </div>
  </div>

  <div id="digests"></div>

  <details class="card" id="advanced">
    <summary>고급 설정</summary>

    <label style="margin-top:8px">내 구독 채널 (Google Drive)</label>
    <div class="sub" id="subsInfo">아직 불러오지 않았습니다.</div>
    <div id="driveBox"></div>

    <label style="margin-top:18px">공통 제외어</label>
    <div class="sub">제목에 이 단어가 있으면 보내지 않습니다.</div>
    <div class="chips" id="excludeChips"></div>
    <div class="add">
      <input id="excludeInput" placeholder="예: 협찬" enterkeyhint="done"
             onkeydown="if(event.key==='Enter'){event.preventDefault();addExclude()}">
      <button class="tiny" onclick="addExclude()">추가</button>
    </div>
  </details>

</main>

<div class="toast" id="toast"></div>

<footer>
  <button class="ghost" id="reloadBtn" onclick="load()">새로고침</button>
  <button class="primary" id="saveBtn" onclick="save()">저장</button>
</footer>

<script>
const REPO = "studioditto-ctrl/lookbook";
const BRANCH = "claude/running-news-telegram-delivery-hgx53y";
const FILE = "settings.yaml";
const RUNS = `https://github.com/${REPO}/actions/workflows/digest.yml`;
// 저장에 실패해도 고친 값을 잃지 않도록 이 기기에 남겨둔다
const DRAFT = "settings_draft";

let data = null, sha = null;
let dirty = false, saving = false, savedAt = null, loadedAt = null, timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm = d => d.toTimeString().slice(0, 5);
/* 열어둔 상세 패널은 다시 그려도 열린 채로 둔다 */
const open = new Set();

let toastTimer = null;
function toast(msg, kind, keep){
  const el = $("toast");
  el.innerHTML = msg;
  el.className = "toast show " + (kind || "");
  clearTimeout(toastTimer);
  if (kind === "ok" && !keep) toastTimer = setTimeout(() => el.className = "toast", 4000);
  if (keep) toastTimer = setTimeout(() => el.className = "toast", 12000);
}

function showState(){
  const el = $("saveState");
  if (saving)      { el.textContent = "저장하는 중…";              el.className = "busy"; }
  else if (dirty)  { el.textContent = "바뀜 — 곧 저장됩니다";      el.className = "dirty"; }
  else if (savedAt){ el.textContent = "저장됨 " + hhmm(savedAt);   el.className = ""; }
  else if (loadedAt){el.textContent = "불러옴 " + hhmm(loadedAt);  el.className = ""; }
  const busy = saving || !data;
  $("saveBtn").disabled = busy;
  $("reloadBtn").disabled = busy;
}

/* 어떤 값이든 바뀌면 곧바로 저장까지 간다 — 저장 버튼을 안 눌러도 반영된다 */
function touch(){
  dirty = true; showState();
  try{ localStorage.setItem(DRAFT, toYaml(data)); }catch(e){ /* 용량 초과는 무시 */ }
  clearTimeout(timer);
  timer = setTimeout(() => save(), 1200);
}
function discardDraft(){
  localStorage.removeItem(DRAFT); dirty = false;
  load();
}

/* ---------- YAML (이 파일의 구조에 한정한 최소 구현) ---------- */
function quote(s){
  s = String(s);
  return /^[\w가-힣ㄱ-ㅎ][\w가-힣ㄱ-ㅎ .·&+-]*$/.test(s) ? s : JSON.stringify(s);
}
function toYaml(d){
  let out = "# 모바일 어드민 페이지가 저장한 파일입니다.\n";
  out += "# 채널 목록은 config*.yaml 에 있습니다.\n\ndigests:\n";
  for (const dg of d.digests){
    out += "  - " + (dg.config ? `config: ${dg.config}\n` : `key: ${quote(dg.key)}\n`);
    if (dg.config && dg.key) out += `    key: ${quote(dg.key)}\n`;
    out += `    label: ${quote(dg.label)}\n    slots:\n`;
    for (const s of dg.slots){
      out += `      - slot: ${s.slot}\n`;
      out += `        title: ${JSON.stringify(s.title)}\n`;
      out += `        send_at: ${JSON.stringify(s.send_at)}\n`;
      out += `        enabled: ${s.enabled ? "true" : "false"}\n`;
      out += `        articles: ${s.articles}\n        videos: ${s.videos}\n`;
    }
    out += "    keywords:\n";
    for (const [k, v] of Object.entries(dg.keywords)) out += `      ${quote(k)}: ${v}\n`;
    if ((dg.queries || []).length){
      out += "    queries:\n";
      for (const q of dg.queries){
        out += `      - name: ${quote(q.name)}\n        query: ${JSON.stringify(q.query)}\n`;
        if (q.tags && q.tags.length) out += `        tags: [${q.tags.join(", ")}]\n`;
      }
    }
    if ((dg.channels || []).length){
      out += "    channels:\n";
      for (const c of dg.channels){
        out += `      - name: ${quote(c.name)}\n        channel_id: ${c.channel_id}\n`;
        if (c.tags && c.tags.length) out += `        tags: [${c.tags.join(", ")}]\n`;
      }
    }
  }
  out += "\nexclude:\n";
  for (const w of d.exclude) out += `  - ${quote(w)}\n`;
  return out;
}
/* 우리가 쓰는 모양만 읽는 파서 — 들여쓰기와 키가 위 형식과 같다고 가정한다 */
function fromYaml(text){
  const out = {digests: [], exclude: []};
  let dg = null, slot = null, mode = null;
  for (const raw of text.split("\n")){
    const line = raw.replace(/\t/g, "  ");
    if (!line.trim() || line.trim().startsWith("#")) continue;
    const indent = line.length - line.trimStart().length;
    const t = line.trim();
    if (t === "digests:"){ mode = "digests"; continue; }
    if (t === "exclude:"){ mode = "exclude"; continue; }
    if (mode === "exclude" && t.startsWith("- ")){ out.exclude.push(unq(t.slice(2))); continue; }
    if (mode !== "digests") continue;

    if (indent === 2 && (t.startsWith("- config:") || t.startsWith("- key:"))){
      dg = {config: "", key: "", label: "", slots: [], keywords: {}, queries: [], channels: []};
      const [k, ...rest] = t.slice(2).split(":");
      dg[k.trim()] = unq(rest.join(":").trim());
      out.digests.push(dg); slot = null; continue;
    }
    if (!dg) continue;
    if (indent === 4 && t.startsWith("key:")){ dg.key = unq(t.slice(4).trim()); continue; }
    if (indent === 4 && t.startsWith("label:")){ dg.label = unq(t.slice(6).trim()); continue; }
    if (indent === 4 && t === "slots:"){ dg._in = "slots"; continue; }
    if (indent === 4 && t === "keywords:"){ dg._in = "keywords"; continue; }
    if (indent === 4 && t === "queries:"){ dg._in = "queries"; continue; }
    if (indent === 4 && t === "channels:"){ dg._in = "channels"; continue; }
    if (dg._in === "queries" || dg._in === "channels"){
      const list = dg._in === "queries" ? dg.queries : dg.channels;
      if (t.startsWith("- name:")){ list.push({name: unq(t.slice(7).trim())}); continue; }
      const cur = list[list.length - 1];
      if (!cur) continue;
      const [k, ...rest] = t.split(":");
      const v = rest.join(":").trim();
      if (k === "tags") cur.tags = v.replace(/[\[\]]/g, "").split(",").map(x => x.trim()).filter(Boolean);
      else cur[k.trim()] = unq(v);
      continue;
    }
    if (dg._in === "slots" && t.startsWith("- slot:")){
      slot = {slot: t.slice(7).trim(), title: "", send_at: "08:00", enabled: true, articles: 1, videos: 1};
      dg.slots.push(slot); continue;
    }
    if (dg._in === "slots" && slot){
      const [k, ...rest] = t.split(":");
      const v = rest.join(":").trim();
      if (k === "title") slot.title = unq(v);
      else if (k === "send_at") slot.send_at = unq(v);
      else if (k === "enabled") slot.enabled = v === "true";
      else if (k === "articles") slot.articles = +v;
      else if (k === "videos") slot.videos = +v;
      continue;
    }
    if (dg._in === "keywords" && indent >= 6){
      const i = t.lastIndexOf(":");
      dg.keywords[unq(t.slice(0, i).trim())] = +t.slice(i + 1).trim();
    }
  }
  out.digests.forEach(d => delete d._in);
  return out;
}
const unq = s => (s.startsWith('"') && s.endsWith('"')) ? JSON.parse(s) : s;

/* ---------- 렌더링 ---------- */
const arg = s => `'${String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'")}'`;

function stepper(di, si, key, val){
  return `<div class="step">
    <button onclick="bump(${di},${si},'${key}',-1)" aria-label="줄이기">−</button>
    <span id="v${di}-${si}-${key}">${val}</span>
    <button onclick="bump(${di},${si},'${key}',1)" aria-label="늘리기">+</button>
  </div>`;
}

function render(){
  $("digests").innerHTML = data.digests.map((dg, di) => `
    <div class="card">
      <h2>${esc(dg.label)}</h2>
      ${dg.slots.map((s, si) => `
        <div class="slot">
          <div class="head">
            <input class="title" value="${esc(s.title)}" aria-label="메시지 제목"
                   onchange="set(${di},${si},'title',this.value)">
            <label class="sw" style="margin:0">
              <input type="checkbox" ${s.enabled ? "checked" : ""}
                     onchange="set(${di},${si},'enabled',this.checked)" aria-label="발송"><i></i>
            </label>
          </div>
          <div style="margin-top:10px">
            <label>보내는 시각</label>
            <input type="time" value="${s.send_at}" onchange="set(${di},${si},'send_at',this.value)">
          </div>
          <div class="duo">
            <div><label>기사</label>${stepper(di, si, "articles", s.articles)}</div>
            <div><label>영상</label>${stepper(di, si, "videos", s.videos)}</div>
          </div>
          <div class="duo">
            <button class="tiny ghost" onclick="testSend(${di},${si})">지금 테스트 발송</button>
            <button class="tiny danger" onclick="delSlot(${di},${si})">이 시간 삭제</button>
          </div>
        </div>`).join("")}
      <button class="tiny wide dashed" onclick="addSlot(${di})">＋ 보낼 시간 추가</button>

      <details data-panel="d${di}" ${open.has("d" + di) ? "open" : ""}
               ontoggle="panel('d${di}',this.open)">
        <summary>키워드 ${Object.keys(dg.keywords).length} · 검색어 ${(dg.queries || []).length} · 채널 ${(dg.channels || []).length}</summary>

        <label style="margin-top:6px">키워드 — 숫자가 클수록 먼저 골라집니다</label>
        <div class="chips">
          ${Object.entries(dg.keywords).map(([k, v]) => `
            <span class="chip">${esc(k)} ${v}
              <button onclick="delKeyword(${di},${arg(k)})" aria-label="삭제">×</button>
            </span>`).join("") || '<span class="sub">없음</span>'}
        </div>
        <div class="add">
          <input id="kw${di}" placeholder="키워드" enterkeyhint="done"
                 autocapitalize="off" autocomplete="off"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();addKeyword(${di})}">
          <button class="tiny" onclick="addKeyword(${di})">추가</button>
        </div>

        <label style="margin-top:16px">검색어 — 구글 뉴스에서 이 말로 찾습니다</label>
        <div class="chips">
          ${(dg.queries || []).map((qq, qi) => `
            <span class="chip">${esc(qq.query)}
              <button onclick="delQuery(${di},${qi})" aria-label="삭제">×</button></span>`).join("")
            || '<span class="sub">없음 (config 파일 목록은 그대로 쓰입니다)</span>'}
        </div>
        <div class="add">
          <input id="q${di}" placeholder="예: 스페셜티 커피" enterkeyhint="done"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();addQuery(${di})}">
          <button class="tiny" onclick="addQuery(${di})">추가</button>
        </div>

        <label style="margin-top:16px">유튜브 채널</label>
        <div class="chips">
          ${(dg.channels || []).map((c, ci) => `
            <span class="chip">${esc(c.name)}
              <button onclick="delChannel(${di},${ci})" aria-label="삭제">×</button></span>`).join("")
            || '<span class="sub">없음 (config 파일 목록은 그대로 쓰입니다)</span>'}
        </div>
        <div class="add">
          <input id="cs${di}" placeholder="구독에서 검색 — 예: 커피"
                 oninput="searchSubs(${di})" enterkeyhint="search">
        </div>
        <div class="chips" id="cr${di}"></div>
      </details>
    </div>`).join("");

  $("excludeChips").innerHTML = data.exclude.map(w => `
    <span class="chip">${esc(w)}
      <button onclick="delExclude(${arg(w)})" aria-label="삭제">×</button>
    </span>`).join("");
}

function panel(id, isOpen){ isOpen ? open.add(id) : open.delete(id); }

/* 한 주제에 시간을 몇 개든 둘 수 있다. 회차 이름은 겹치지 않게 만든다. */
function addSlot(di){
  const dg = data.digests[di];
  const used = new Set(dg.slots.map(s => s.slot));
  let name;
  do { name = "s" + Math.random().toString(36).slice(2, 7); } while (used.has(name));

  const last = dg.slots[dg.slots.length - 1];
  dg.slots.push({
    slot: name,
    title: `${dg.label} 브리핑`,
    send_at: nextHour(last && last.send_at),
    enabled: true,
    articles: last ? last.articles : 1,
    videos: last ? last.videos : 3,
  });
  render(); touch();
  toast(`${esc(dg.label)} 에 보낼 시간을 하나 더 넣었습니다. 시각과 제목을 정해주세요.`, "busy");
}
/* 마지막 시각 다음의 정시. 없으면 09:00 */
function nextHour(send_at){
  if (!send_at) return "09:00";
  const h = (parseInt(send_at.slice(0, 2), 10) + 1) % 24;
  return String(h).padStart(2, "0") + ":00";
}
function delSlot(di, si){
  const dg = data.digests[di], s = dg.slots[si];
  if (!confirm(`'${s.title}' (${s.send_at}) 을(를) 지울까요?`)) return;
  dg.slots.splice(si, 1);
  render(); touch();

/* 구글 토큰. 한 번 허락하면 다음부터는 창 없이 조용히 받아온다. */
function googleToken(interactive){
  return new Promise((resolve, reject) => {
    if (gToken && Date.now() - gTokenAt < 50 * 60 * 1000) return resolve(gToken);
    const oauth = window.google && google.accounts && google.accounts.oauth2;
    if (!oauth) return reject(new Error("구글 스크립트를 불러오지 못했습니다. 새로고침해 주세요."));
    const client_id = localStorage.getItem("g_client_id");
    if (!client_id) return reject(new Error("먼저 클라이언트 ID 를 넣어주세요."));
    oauth.initTokenClient({
      client_id, scope: DRIVE_SCOPE,
      callback: r => {
        if (!r || !r.access_token) return reject(new Error(r && r.error || "권한을 받지 못했습니다."));
        gToken = r.access_token; gTokenAt = Date.now();
        resolve(gToken);
      },
      error_callback: e => reject(new Error((e && e.type) === "popup_closed"
        ? "창을 닫았습니다." : "권한 요청이 막혔습니다. 팝업 차단을 풀어주세요.")),
    }).requestAccessToken({prompt: interactive ? "consent" : ""});
  });
}
async function drive(path){
  const r = await fetch("https://www.googleapis.com/drive/v3/" + path,
                        {headers: {Authorization: "Bearer " + gToken}});
  if (!r.ok){
    const j = await r.json().catch(() => ({}));
    throw new Error(`${r.status} ${(j.error && j.error.message) || r.statusText}`);
  }
  return r;
}

async function driveText(id, name, mimeType){
  if (mimeType === "application/vnd.google-apps.spreadsheet"){
    const r = await drive(`files/${id}/export?mimeType=text/csv`);
    return r.text();
  }
  const r = await drive(`files/${id}?alt=media`);
  const buf = await r.arrayBuffer();
  const zip = /\.zip$/i.test(name) || mimeType.includes("zip");
  return zip ? unzipSubscriptions(buf) : new TextDecoder("utf-8").decode(buf);
}

function useSubs(text, meta){

    return;
  }
  subs = parsed;
  subsMeta = {id: meta.id, name: meta.name, mimeType: meta.mimeType, at: Date.now()};
  localStorage.setItem("subs", JSON.stringify(subs));
  localStorage.setItem("subs_meta", JSON.stringify(subsMeta));

/* 채널 ID 열의 자리가 언어판마다 달라 값으로 찾는다 */
function parseSubs(text){
  const out = [], seen = new Set();
  for (const line of text.split(/\r?\n/)){
    if (!line.trim()) continue;
    const cols = line.split(",").map(c => c.trim().replace(/^"|"$/g, ""));
    const id = cols.find(c => /^UC[\w-]{22}$/.test(c));
    if (!id || seen.has(id)) continue;
    const title = cols.filter(c => c !== id && c && !/^https?:/i.test(c)).pop();
    if (!title) continue;
    seen.add(id); out.push({id, title});
  }
  return out;
}

/* zip 안의 구독정보 csv 하나만 꺼낸다. 라이브러리 없이 중앙 디렉터리를 읽는다. */
async function unzipSubscriptions(buf){
  const view = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if (view.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("zip 을 읽지 못했습니다.");
  const count = view.getUint16(eocd + 10, true);
  let off = view.getUint32(eocd + 16, true);
  if (off === 0xffffffff) throw new Error("4GB 가 넘는 zip 은 못 읽습니다. csv 만 따로 올려주세요.");

  const dec = new TextDecoder("utf-8");
  for (let n = 0; n < count; n++){
    if (view.getUint32(off, true) !== 0x02014b50) break;
    const method = view.getUint16(off + 10, true);
    const csize  = view.getUint32(off + 20, true);
    const nameLen = view.getUint16(off + 28, true);
    const extraLen = view.getUint16(off + 30, true);
    const cmtLen = view.getUint16(off + 32, true);
    const local = view.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));

    if (/\.csv$/i.test(name) && /(subscriptions|구독)/i.test(name)){
      const lNameLen = view.getUint16(local + 26, true);
      const lExtraLen = view.getUint16(local + 28, true);
      const start = local + 30 + lNameLen + lExtraLen;
      const data = u8.subarray(start, start + csize);
      if (method === 0) return dec.decode(data);
      if (method !== 8) throw new Error("이 zip 의 압축 방식은 못 풉니다.");
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Response(stream).text();
    }
    off += 46 + nameLen + extraLen + cmtLen;
  }
  throw new Error("zip 안에서 구독정보 csv 를 찾지 못했습니다.");
}

/* ---------- GitHub ---------- */
const token = () => localStorage.getItem("gh_token") || "";
const api = path => `https://api.github.com/repos/${REPO}/contents/${path}`;
const headers = () => ({Authorization: "Bearer " + token(), Accept: "application/vnd.github+json"});
const enc = t => btoa(unescape(encodeURIComponent(t)));
const dec = c => decodeURIComponent(escape(atob(c.replace(/\n/g, ""))));

async function getFile(path){
  const h = {Accept: "application/vnd.github+json"};
  if (token()) h.Authorization = "Bearer " + token();
  const r = await fetch(`${api(path)}?ref=${encodeURIComponent(BRANCH)}`, {headers: h, cache: "no-store"});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
async function putFile(path, text, shaRef, message){
  const body = {message, content: enc(text), branch: BRANCH};
  if (shaRef) body.sha = shaRef;
  const r = await fetch(api(path), {method: "PUT", headers: headers(), body: JSON.stringify(body)});
  if (!r.ok){
    const j = await r.json().catch(() => ({}));
    const err = new Error(`${r.status} ${j.message || r.statusText}`);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

/* GET /repos 의 permissions 는 '내가' 이 저장소에 갖는 권한이라 토큰이 무엇을
   받았는지는 알려주지 않는다. 공개 저장소라 읽기는 누구나 되므로, 토큰이
   무엇을 못 하는지 확인할 수 있는 건 계정뿐이다. 나머지는 짚어만 준다. */
const OWNER = REPO.split("/")[0];
let authProblem = null;

async function tokenOwner(){
  try{
    const r = await fetch("https://api.github.com/user", {headers: headers()});
    if (r.status === 401) return {bad: "토큰이 만료됐거나 잘못됐습니다. 새로 발급해 넣어주세요."};
    if (!r.ok) return {bad: `계정을 확인하지 못했습니다 (${r.status}).`};
    return {login: (await r.json()).login};
  }catch(e){ return {bad: "계정을 확인하지 못했습니다: " + e.message}; }
}

/* 403 은 fine-grained 토큰이 이 저장소에 대해 Contents 쓰기를 못 받았다는 뜻이다.
   원인이 두 가지뿐이라 둘 다 짚어주고, 계정만 실제로 확인해 준다. */
async function showAuthProblem(detail){
  const who = await tokenOwner();
  authProblem = {
    detail,
    account: who.bad
      ? {bad: true, text: who.bad}
      : who.login === OWNER
        ? {bad: false, text: `토큰 계정 ${who.login} — 저장소 주인과 같습니다.`}
        : {bad: true, text: `토큰이 <b>${esc(who.login)}</b> 계정 것입니다. `
            + `${esc(OWNER)} 계정으로 다시 발급해 주세요.`},
  };
  renderToken();
}
function clearAuthProblem(){ if (authProblem){ authProblem = null; renderToken(); } }

async function checkToken(){
  if (!token()){ toast("먼저 토큰을 넣어주세요.", "err"); return; }
  toast("토큰을 확인하는 중…", "busy");
  const who = await tokenOwner();
  if (who.bad){ await showAuthProblem(who.bad); toast(who.bad, "err", true); return; }
  if (who.login !== OWNER){
    await showAuthProblem("토큰 계정이 저장소 주인과 다릅니다.");
    toast(`토큰이 ${esc(who.login)} 계정 것입니다.`, "err", true);
    return;
  }
  // 쓰기 권한은 실제로 써 봐야만 알 수 있다 — 내용을 그대로 다시 올려 확인한다.
  try{
    const cur = await getFile(FILE);
    const r = await putFile(FILE, dec(cur.content), cur.sha, "설정 확인 (모바일 어드민)");
    sha = r.content.sha;
    clearAuthProblem();
    toast("토큰 정상 — 방금 실제로 써 봤고 됩니다.", "ok");
  }catch(e){
    await showAuthProblem(`${e.status || ""} ${e.message}`.trim());
    toast("쓰지 못했습니다. 아래 안내를 확인해 주세요.", "err");
  }
}

         rel="noopener">내 토큰 목록 열기 →</a>
      <div class="duo" style="margin-top:12px">
        <button class="tiny" onclick="checkToken()">고쳤어요, 다시 확인</button>
        <button class="tiny ghost" onclick="clearToken()">다른 토큰 넣기</button>
      </div>
    </div>`;
}

function renderToken(){
  const has = !!token();
  if (has && authProblem){ $("tokenCard").innerHTML = authProblemCard(); return; }
  $("tokenCard").innerHTML = has ? `
    <div class="card" style="padding:10px 14px">
      <div class="row" style="justify-content:space-between">
        <span class="sub" style="color:var(--ok)">✓ GitHub 토큰 등록됨</span>
        <span class="row" style="gap:6px">
          <button class="tiny ghost" onclick="checkToken()">점검</button>
          <button class="tiny ghost" onclick="clearToken()">지우기</button>
        </span>
      </div>
    </div>` : `
    <div class="card" style="border-color:var(--accent)">
      <h2>먼저 GitHub 토큰을 넣어주세요</h2>
      <div class="sub">이걸 넣어야 바꾼 값이 저장됩니다. 이 기기에만 저장됩니다.</div>
      <div class="row" style="margin-top:10px">
        <input id="token" type="password" placeholder="github_pat_..."
               autocomplete="off" enterkeyhint="done"
               onkeydown="if(event.key==='Enter'){event.preventDefault();saveToken()}">
      </div>
      <button class="primary wide" onclick="saveToken()">토큰 저장</button>
      <div class="note">
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank"
           rel="noopener" style="color:var(--accent)">토큰 만들러 가기 →</a><br>
        Repository access 는 <b>Only select repositories → ${REPO}</b>,<br>
        Repository permissions 의 <b>Contents</b> 를 <b>Read and write</b> 로.
        (Read-only 면 저장할 때 403 이 납니다)
      </div>
    </div>`;
}

function saveToken(){
  const v = ($("token") || {}).value?.trim();
  if (!v){ toast("토큰을 붙여넣어 주세요.", "err"); return; }
  localStorage.setItem("gh_token", v);
  renderToken();
  toast("토큰을 이 기기에 저장했습니다.", "ok");
  if (dirty) save();
}
function clearToken(){
  localStorage.removeItem("gh_token"); authProblem = null; renderToken();
  toast("토큰을 지웠습니다.", "ok");
}

async function load(){
  clearTimeout(timer); timer = null;
  toast("불러오는 중…", "busy");
  try{
    const j = await getFile(FILE);
    if (!j) throw new Error("settings.yaml 이 없습니다.");
    sha = j.sha;
    data = fromYaml(dec(j.content));
    loadedAt = new Date(); savedAt = null;

    const draft = localStorage.getItem(DRAFT);
    if (draft && draft !== toYaml(data)){
      data = fromYaml(draft);
      dirty = true;
      render(); showState();
      toast(`저장하지 못한 변경이 남아 있어 되살렸습니다.
             <a href="#" onclick="save();return false">지금 저장</a> ·
             <a href="#" onclick="discardDraft();return false">버리고 서버 값 쓰기</a>`, "err", true);
      return;
    }
    dirty = false;
    render(); showState();
    toast("최신 설정을 불러왔습니다.", "ok");
  }catch(e){ toast("불러오지 못했습니다: " + esc(e.message), "err"); showState(); }
}

async function save(){
  clearTimeout(timer); timer = null;
  if (!data || !dirty) return true;
  if (!token()){ toast("먼저 맨 위에 GitHub 토큰을 넣어주세요. 넣으면 바로 저장됩니다.", "err"); return false; }
  if (saving) return false;

  saving = true; showState();
  const text = toYaml(data);
  try{
    let r;
    try{
      r = await putFile(FILE, text, sha, "설정 변경 (모바일 어드민)");
    }catch(e){
      // 다른 곳에서 먼저 바뀌면 sha 가 어긋난다. 최신 sha 로 한 번 다시 민다.
      if (e.status !== 409 && e.status !== 422) throw e;
      const cur = await getFile(FILE);
      sha = cur && cur.sha;
      r = await putFile(FILE, text, sha, "설정 변경 (모바일 어드민)");
    }
    sha = r.content.sha;
    dirty = false; savedAt = new Date();
    localStorage.removeItem(DRAFT);
    clearAuthProblem();
    toast("저장했습니다. 다음 발송부터 반영됩니다.", "ok");
    return true;
  }catch(e){
    // 고친 값은 DRAFT 에 남아 있다. 새로고침해도 되살아난다.
    if (e.status === 401 || e.status === 403){
      await showAuthProblem(e.message);
      toast(`저장하지 못했습니다 — 맨 위 안내를 봐주세요.
             고친 값은 이 기기에 남아 있으니 없어지지 않습니다.`, "err", true);
    } else {
      toast(`저장하지 못했습니다 (${esc(e.message)})
             <div style="margin-top:6px"><a href="#" onclick="save();return false">다시 시도</a>
             — 고친 값은 이 기기에 남아 있으니 없어지지 않습니다.</div>`, "err", true);
    }
    return false;
  }finally{ saving = false; showState(); }
}

async function testSend(di, si){
  const dg = data.digests[di], s = dg.slots[si];
  if (!token()){ toast("먼저 맨 위에 GitHub 토큰을 넣어주세요.", "err"); return; }
  if (dirty && !(await save())) return;

  toast(`'${esc(s.title)}' 발송을 요청하는 중…`, "busy");
  try{
    const cur = await getFile(".trigger");
    // 첫 줄이 회차, 둘째 줄 force 는 이미 보낸 항목도 다시 보내라는 뜻이다.
    const line = `${dg.config || dg.key}:${s.slot}`;
    const body = `${line}\nforce\n${new Date().toISOString()}\n`;
    await putFile(".trigger", body, cur && cur.sha, `테스트 발송 ${line}`);
    toast(`보내는 중입니다. 1~2분 뒤 텔레그램을 확인하세요.
           <a href="${RUNS}" target="_blank" rel="noopener">실행 기록 보기 →</a>`, "ok", true);
  }catch(e){ toast("발송을 요청하지 못했습니다: " + esc(e.message), "err"); }
}

/* 저장이 끝나기 전에 화면을 닫으면 알려준다 */
addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });

renderToken();
renderDrive();
showState();
load();
</script>
</body>
</html>
