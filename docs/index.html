<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>다이제스트 설정</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Cpath d='M14 31 50 16 40 49l-9-10-4 9-2-12z' fill='%23fff'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <div>
    <h1>다이제스트 설정</h1>
    <div class="sub">studioditto-ctrl/lookbook · <span id="build"></span></div>
  </div>
  <div id="saveState">불러오는 중…</div>
</header>

<main>
  <div id="tokenCard"></div>
  <div id="driveSetup"></div>

  <!-- 맨 위: 주제 추가 -->
  <div class="card">
    <h2>주제 추가</h2>
    <div class="sub">넣은 말로 구글 뉴스와 <b>유튜브</b> 를 찾고, 구독 목록에서 이름이 맞는
      채널도 붙입니다. 영상이 들어와야 텔레그램 썸네일이 뜹니다.</div>
    <div class="add">
      <input id="newTopic" placeholder="예: 커피" enterkeyhint="done"
             autocapitalize="off" autocomplete="off"
             onkeydown="if(event.key==='Enter'){event.preventDefault();addTopic()}">
      <button class="primary" onclick="addTopic()">만들기</button>
    </div>
  </div>

  <div id="digests"></div>

  <details class="card" id="advanced">
    <summary>고급 설정</summary>

    <label style="margin-top:8px">내 구독 채널 (Google Drive)</label>
    <div class="sub" id="subsInfo">아직 불러오지 않았습니다.</div>
    <div id="driveBox"></div>

    <label style="margin-top:18px">즐겨찾기에 두기</label>
    <div class="note" id="bookmarkHelp"></div>

    <label style="margin-top:18px">공통 제외어</label>
    <div class="sub">제목에 이 단어가 있으면 보내지 않습니다.</div>
    <div class="chips" id="excludeChips"></div>
    <div class="add">
      <input id="excludeInput" placeholder="예: 협찬" enterkeyhint="done"
             onkeydown="if(event.key==='Enter'){event.preventDefault();addExclude()}">
      <button class="tiny" onclick="addExclude()">추가</button>
    </div>
  </details>

</main>

<div class="toast" id="toast"></div>

<footer>
  <button class="ghost" id="reloadBtn" onclick="load()">새로고침</button>
  <button class="primary" id="saveBtn" onclick="save()">저장</button>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
