# 모바일 어드민 페이지가 저장한 파일입니다.
# 채널 목록은 config*.yaml 에 있습니다.

digests:
  - key: tmty4aeqx
    label: 러닝
    scope: [러닝, 달리기, 마라톤, 조깅, 런린이, 육상, running, marathon, jogging, runner]
    strict: true
    slots:
      - slot: daily
        title: "러닝 브리핑"
        send_at: "08:00"
        enabled: true
        articles: 2
        videos: 3
    keywords:
      러닝: 3
      달리기: 3
      마라톤: 3
      조깅: 2
      러닝화: 2
      하프마라톤: 2
      풀코스: 1
      페이스: 1
      케이던스: 1
      런린이: 1
      트레일러닝: 1
      running: 1
      marathon: 1
      jogging: 1
      running shoes: 1
      pace: 1
      cadence: 1
      trail running: 1
      sub3: 1
      서브3: 1
    queries:
      - name: 러닝
        query: "러닝 OR 달리기 OR 마라톤 OR 조깅 OR 러닝화 OR 하프마라톤"
    feeds:
      - name: "Runner's World"
        url: "https://www.runnersworld.com"
        region: international
        reason: "세계 최대 규모의 러닝 전문 언론사로 최신 트렌드, 건강 정보, 제품 평가를 다룹니다."
      - name: Athletics Weekly
        url: "https://athleticsweekly.com/feed/"
        region: international
        reason: "육상 및 장거리 러닝, 트랙 경기 소식을 전문적으로 취재하는 영국의 전문 매체입니다."
      - name: Believe in the Run
        url: "https://believeintherun.com/feed/"
        region: international
        reason: "신제품 러닝화 및 트레일 러닝용품에 대한 깊이 있고 독립적인 리뷰를 작성하는 독립 블로그입니다."
      - name: DC Rainmaker
        url: "https://www.dcrainmaker.com/feed"
        region: international
        reason: "가민, 애플워치 등 러닝용 스마트워치 및 GPS 테크 기기에 관한 최고 수준의 리뷰 블로그입니다."
    channels:
      - name: 마라닉 TV
        channel_id: UCx_2bXULZciQY76UoDhIntA
        region: domestic
        reason: "러닝 초보자를 위한 폼 교정, 마라톤 훈련법 및 다양한 러닝 관련 정보와 팁을 제공합니다."
      - name: 런업 RunUp
        channel_id: UCGDGw1dMotpPPWXC6ee_cZA
        region: domestic
        reason: "러닝 라이프스타일, 러닝화 리뷰 및 일상 달리기의 즐거움을 전하는 라이프스타일 러닝 채널입니다."
      - name: 정석근 헬스마라톤
        channel_id: UCLMgTOIsSuQhkRg_W52zMjQ
        region: domestic
        reason: "마라톤 선수 출신의 주법 지도 및 주행 팁, 부상 방지 관련 전문 지식을 다룹니다."
      - name: 올댓러닝
        channel_id: UCMlX3EmToQMkz5fz0VO-tkw
        region: domestic
        reason: "다양한 러닝 기어 리뷰와 트랙/로드 러닝 훈련법을 알기 쉽게 전해줍니다."
      - name: The Running Channel
        channel_id: UCX7dV4OPDSutwMUauSD5AAA
        region: international
        reason: "러닝 훈련법, 챌린지, 용품 리뷰 등 전 세계 러너들을 위한 다채로운 비디오를 제공합니다."
      - name: Kofuzi
        channel_id: UCe43pe3w4L6w3tNMRkWiJBA
        region: international
        reason: "마라톤 준비 과정과 시중의 최신 러닝화 리뷰를 솔직하게 전하는 해외 유튜버입니다."
      - name: Seth James DeMoor
        channel_id: UCeSHo5kTvzoik4STh7MuMCA
        region: international
        reason: "매일 일상적인 러닝 브이로그와 러닝화 신제품 상세 리뷰를 올리는 인기 해외 러너입니다."
      - name: Sweat Elite
        channel_id: UCFYpwqeNXx7M9xosFjdm5kQ
        region: international
        reason: "엘리트 마라톤 선수들의 훈련 방식과 밀착 취재 영상을 다루는 전문 러닝 채널입니다."
      - name: "Runner's World"
        channel_id: UCx2Xqm8S3Ghqn5puhSKWH4Q
        region: international
        reason: "세계적인 러닝 전문 매거진의 공식 유튜브 채널로 선수 인터뷰와 트레이닝 팁을 전달합니다."

exclude:
  - 부고
  - 채용
  - 분양
  - 협찬
  - 체험단
  - 원고료
  - 소정의
  - 광고
  - 할인
  - 특가
  - 쿠폰
  - sale
  - deal
  - discount
  - coupon
  - prime day
  - black friday
