name: 소스 추천

on:
  # 어드민 페이지의 '새 주제 만들기' 마법사가 테마를 입력하면 이 이벤트를 쏜다.
  #   POST https://api.github.com/repos/<소유자>/<저장소>/dispatches
  #   Authorization: Bearer <PAT>   (Contents: Read and write)
  #   {"event_type": "recommend_sources",
  #    "client_payload": {"theme": "...", "slug": "...", "exclude": "이름1, 이름2"}}
  #   exclude 는 '추가 검색'에서 이미 나온 이름을 다시 추천받지 않으려고
  #   보낸다. 없으면 빈 문자열.
  #
  # 결과는 state/recommend/<slug>.json 에 커밋되고, 페이지는 그 파일이
  # 생길 때까지 폴링한다. API 키를 브라우저에 둘 수 없어 이 경로로 돈다.
  repository_dispatch:
    types: [recommend_sources]
  # Actions 화면에서 수동으로 테스트해 볼 수 있는 경로.
  workflow_dispatch:
    inputs:
      theme:
        description: 추천받을 테마
        type: string
        required: true
      slug:
        description: 결과 파일 이름(state/recommend/<slug>.json)
        type: string
        required: true
      exclude:
        description: 쉼표로 구분한, 이미 추천받은 이름 목록(추가 검색 흉내)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 추천 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 계정 등급이나 모델이 또 바뀌면 코드를 고치지 않고 저장소 변수
          # (Settings → Secrets and variables → Actions → Variables)로
          # GEMINI_MODEL 을 넣어 바꿀 수 있다. 안 넣으면 코드 기본값을 쓴다.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            theme="${{ inputs.theme }}"; slug="${{ inputs.slug }}"; exclude="${{ inputs.exclude }}"
          else
            theme="${{ github.event.client_payload.theme }}"
            slug="${{ github.event.client_payload.slug }}"
            exclude="${{ github.event.client_payload.exclude }}"
          fi
          python src/recommend.py --theme "$theme" --slug "$slug" --exclude "$exclude"

      - name: 결과 커밋
        run: |
          if [ -z "$(git status --porcelain state/recommend)" ]; then
            echo "변경된 결과 파일이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/recommend
          git commit -m "chore: 소스 추천 결과 저장"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "푸시 실패, 리베이스 후 재시도 ($attempt/3)"
            sleep $((attempt * 3))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          exit 1
