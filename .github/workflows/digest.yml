name: 러닝 다이제스트

on:
  schedule:
    # 발송 시각은 settings.yaml 에 있고 어드민 페이지에서 바꾼다.
    # 여기서는 깨어나 '지금 보낼 회차'가 있는지만 확인한다.
    #
    # 30분마다(하루 48번)로 걸었더니 깃허브가 점점 밀어냈다. 실제 간격을
    # 재보니 8/25 저녁에는 30분이던 것이 8/27 에는 10시간까지 벌어졌고,
    # 08:00 KST 앞뒤로 한 번도 돌지 않아 그날 러닝이 통째로 빠졌다.
    # 크론은 '이 시각에 돈다'가 아니라 '이 시각 뒤에 여유가 생기면 돈다'는
    # 뜻이고, 자주 부를수록 뒤로 밀린다. 정시마다(하루 24번)로 줄인다.
    - cron: '0 * * * *'
  # Actions 화면을 열 수 없을 때 발송을 돌리기 위한 경로.
  # .trigger 파일이 바뀐 푸시에서만 실행된다 — 일반 코드 푸시로는 발송되지 않는다.
  push:
    paths:
      - '.trigger'
  workflow_dispatch:
    inputs:
      slot:
        description: 발송 슬롯 (settings.yaml 의 slot 이름)
        type: string
        default: morning
      config:
        description: 설정 파일 또는 주제 key (비우면 슬롯 이름으로 정한다)
        type: string
        default: ''
      dry_run:
        description: 전송하지 않고 메시지만 확인
        type: boolean
        default: false

# state/ 를 커밋해 되돌리기 위해 쓰기 권한이 필요하다
permissions:
  contents: write

# 동시성 그룹을 두지 않는다.
#
# state 커밋이 겹치는 걸 막으려고 group: digest 를 뒀었는데, 깃허브는 그룹당
# '대기 중' 실행을 하나만 남긴다. cancel-in-progress: false 는 '실행 중'인
# 것만 지켜줄 뿐이라, 새 실행이 들어오면 대기 중이던 것이 취소된다.
# 테스트 발송을 주제마다 연달아 누르면 첫 번째와 마지막만 돌고 가운데가
# 조용히 사라졌다.
#
# 커밋 충돌은 아래 '발송 이력 커밋' 단계가 리베이스 후 재시도로 이미 처리한다.

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 회차 결정
        id: slot
        run: |
          # 정기 실행은 settings.yaml 을 보고 스스로 판단한다(--due).
          mode="--due"
          name=""; slot=""; force=""

          if [ -n "${{ inputs.slot }}" ]; then
            slot="${{ inputs.slot }}"
            name="${{ inputs.config }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -f .trigger ]; then
            # 첫 줄: <슬롯> 또는 <설정>:<슬롯>
            #   evening / food:lunch / config.food.yaml:lunch / <settings.yaml 의 key>:daily
            want="$(head -1 .trigger | tr -d '[:space:]')"
            case "$want" in
              *:*) name="${want%%:*}"; slot="${want##*:}" ;;
              *)   slot="$want" ;;
            esac
            # 둘째 줄이 force 면 이미 보낸 항목도 다시 보낸다 (어드민 페이지의 테스트 발송)
            if [ "$(sed -n 2p .trigger | tr -d '[:space:]')" = "force" ]; then
              force=" --ignore-seen"
            fi
          fi

          if [ -n "$slot" ]; then
            if   [ -n "$name" ] && [ -f "$name" ];             then config="$name"
            elif [ -n "$name" ] && [ -f "config.$name.yaml" ]; then config="config.$name.yaml"
            elif [ -n "$name" ];                              then config="$name"   # config 없는 주제
            else
              case "$slot" in
                lunch) config=config.food.yaml ;;
                night) config=config.fashion.yaml ;;
                *)     config=config.yaml ;;
              esac
            fi
            mode="--config $config --slot $slot$force"
          fi

          echo "args=$mode" >> "$GITHUB_OUTPUT"
          echo "이번 실행: $mode"

      - name: 다이제스트 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.RUNNING1978XIANAO_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 없으면 요약을 건너뛰고 제목만 보낸다 (발송 자체는 실패하지 않음)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.RUNNING_API }}
          # 없으면 RSS 로 시도한다. 러너에서는 RSS 가 404 를 자주 내므로 키를 권한다.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 없으면 네이버 블로그 검색만 건너뛴다 (발송은 그대로 된다)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python src/main.py ${{ steps.slot.outputs.args }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: 발송 이력 커밋
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --porcelain state)" ]; then
            echo "변경된 상태 파일이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore: 발송 이력 갱신"
          # 다른 회차가 먼저 밀어넣었을 수 있으니 리베이스 후 재시도한다
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "푸시 실패, 리베이스 후 재시도 ($attempt/3)"
            sleep $((attempt * 3))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          exit 1
