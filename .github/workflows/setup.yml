name: chat_id 확인

# TELEGRAM_BOT_TOKEN 만 등록해두면 chat_id 를 찾아서 로그에 출력한다.
# 브라우저로 getUpdates URL 을 직접 열 필요가 없다.
on: workflow_dispatch

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: chat_id 조회
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python src/whoami.py
