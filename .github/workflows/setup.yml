name: chat_id 확인

# TELEGRAM_BOT_TOKEN 만 등록해두면 chat_id 를 찾아서 로그에 출력하고,
# 채팅방이 하나면 텔레그램으로 확인 메시지도 보낸다.
# 브라우저로 getUpdates URL 을 직접 열 필요가 없다.
on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: 확인 메시지 보내기
        type: boolean
        default: true

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # 시크릿 '값'은 GitHub 이 가려주므로, 등록된 '이름'만 출력해
      # 이름이 틀렸는지 아예 등록이 안 됐는지 구분한다.
      - name: 등록된 시크릿 이름 확인
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os

          names = sorted(json.loads(os.environ["SECRETS_JSON"]))
          print("이 레포 Actions 에 등록된 시크릿 이름:")
          for name in names:
              print(f"  - {name}")

          if "github_token" in names and len(names) == 1:
              print("\n등록된 시크릿이 없습니다. (github_token 은 GitHub 이 자동 제공)")
              print("Settings → Secrets and variables → Actions → Secrets 탭 →")
              print("New repository secret 에서 TELEGRAM_BOT_TOKEN 을 추가하세요.")
          elif "TELEGRAM_BOT_TOKEN" not in names:
              print("\nTELEGRAM_BOT_TOKEN 이 목록에 없습니다.")
              print("위 이름 중 오타가 있다면 지우고 정확한 이름으로 다시 등록하세요.")
          PY

      - name: 시크릿 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.RUNNING1978XIANAO_BOT }}
        run: |
          missing=0
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error title=봇 토큰 시크릿이 비어 있습니다::TELEGRAM_BOT_TOKEN 또는 RUNNING1978XIANAO_BOT 이름으로 Settings → Secrets and variables → Actions 의 Repository secrets 에 등록하세요."
            missing=1
          fi
          exit $missing

      - name: chat_id 조회
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.RUNNING1978XIANAO_BOT }}
        run: |
          python src/whoami.py \
            ${{ inputs.send_test_message == false && '--no-test-message' || '' }}
