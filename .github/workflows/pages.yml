name: 어드민 페이지 배포

# docs/ 가 바뀌면 GitHub Pages 로 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두면 이 워크플로가 배포한다.
on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: echo "배포 완료 → ${{ steps.deploy.outputs.page_url }}"
