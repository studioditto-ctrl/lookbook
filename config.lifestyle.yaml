# 패션·음식 다이제스트 (구독 채널 기반)
#
# 러닝 다이제스트와 같은 파이프라인을 쓰고, 상태만 state/lifestyle/ 로 분리된다.
# 소스마다 tags 를 달고 슬롯이 tags 로 골라 쓰기 때문에, 같은 채널 묶음에서
# 시간대별로 다른 주제를 보낼 수 있다.

timezone: Asia/Seoul

slots:
  # 점심 무렵 — 먹을거리
  lunch:
    title: "🍜 점심 뭐 먹지"
    tags: [food]
    articles: 1
    videos: 4
  # 밤 — 옷·스타일
  night:
    title: "👕 오늘의 스타일"
    tags: [fashion]
    articles: 1
    videos: 4

lookback_hours: 48

summary:
  enabled: true
  effort: low

link_preview:
  mode: first
  prefer: video
  large: true
  above_text: true

sources:
  google_news:
    - name: 패션 트렌드
      query: 패션 트렌드 OR 스타일링 OR 브랜드 신제품
      lang: ko
      country: KR
      tags: [fashion]
    - name: 맛집·미식
      query: 맛집 OR 미식 OR 레스토랑 신메뉴
      lang: ko
      country: KR
      tags: [food]

  rss: []

