<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다이제스트 설정</title>
<!--
  어드민 페이지는 docs/ 에 있다.

  Pages Source 가 "GitHub Actions" 면 pages.yml 이 docs/ 만 올리므로 이 파일은
  쓰이지 않는다. "Deploy from a branch (root)" 로 바뀌면 저장소 루트가 그대로
  배포되는데, 그때 루트에 index.html 이 없으면 README.md 가 표시된다.
  이 파일이 그 경우에 docs/ 로 넘겨준다.
-->
<meta http-equiv="refresh" content="0; url=./docs/">
<link rel="canonical" href="./docs/">
<style>
  :root{ color-scheme: light dark; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    background:#f6f7f9; color:#14171a; padding:24px; text-align:center;
  }
  @media (prefers-color-scheme:dark){ body{ background:#0f1115; color:#e8eaed; } }
  a{ color:#1f6feb; font-weight:600 }
</style>
</head>
<body>
  <div>
    <p>다이제스트 설정 화면으로 이동합니다…</p>
    <p><a href="./docs/">열리지 않으면 여기를 눌러주세요 →</a></p>
  </div>
  <script>location.replace("./docs/");</script>
</body>
</html>
