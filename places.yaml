# 인스타 장소 아카이브 봇 기본 설정
#
# PC마다 다른 값(vault 경로 등)은 %USERPROFILE%\.lookbook\places.yaml 에 같은 키로
# 적으면 이 파일 위에 덮어쓴다. 비밀값은 같은 폴더의 places.env 에.

# 옵시디언 vault — 구글 드라이브 데스크톱 앱이 동기화하는 로컬 경로
obsidian:
  vault_path: ""                            # 설치 스크립트가 PC 쪽 places.yaml 에 적는다
  folder: "Places"                          # vault 안에서 장소 노트를 둘 폴더
  index_note: "장소 목록"                   # 지역별 목록 노트 이름

# 구글 지도 저장 목록 자동 저장 (Playwright 브라우저 자동화, 실험 기능)
gmaps:
  enabled: true
  list_prefix: "📍"
  # city: 시 단위 (구글 지도 주소 기준) — 📍경기 성남시 · 군이면 📍강원 · 특별·광역시는 📍서울 · 해외는 📍일본
  # region: 시도 단위 + list_groups 로 합치기 / area: 📍서울 성수 처럼 동네까지
  list_unit: "city"
  list_groups:                # list_unit: region 일 때만. 같은 목록으로 합칠 시도
    서울: 서울·경기
    경기: 서울·경기
    인천: 서울·경기
  headless: false             # 구글이 헤드리스 브라우저를 막는 경우가 많아 기본은 창을 띄운다
  browser_channel: "chrome"   # 설치된 크롬 사용. 없으면 "" 로 두면 Playwright 크로미움

# 장소 추출. provider: gemini (기본, GEMINI_API_KEY) 또는 claude (ANTHROPIC_API_KEY)
# Gemini 모델은 러닝 다이제스트와 같은 src/gemini_client.py 기본값을 쓰고,
# 막히면 사용 가능한 모델로 알아서 바꾼다. 아래 model·effort 는 claude 일 때만 쓴다.
extract:
  provider: "gemini"
  gemini_model: "gemini-3.8-flash"          # 2026-10-17 이 계정에서 실제로 되는 모델. 막히면 자동 전환
  model: "claude-opus-5-5"
  effort: "low"

# 동네 상권 이름 보정. 카카오 주소의 동 이름 → 상권 이름
# 규칙에 없으면 '성수동2가 → 성수', '연남동 → 연남' 처럼 자동으로 줄인다.
region_alias:
  서교동: 홍대
  동교동: 홍대
  신사동: 신사
  청담동: 청담
  삼청동: 삼청
  소격동: 삼청
  익선동: 익선
  을지로3가: 을지로
  을지로4가: 을지로

# 수도권·광역시는 '서울 성수' 처럼 시+동네, 그 외 지역은 '강원 강릉' 처럼 도+시군
metro: [서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종]
