# 러닝 다이제스트 설정
#
# 소스를 추가하거나 빼려면 이 파일만 고치면 됩니다.
# 커밋하면 다음 실행부터 바로 반영됩니다.

timezone: Asia/Seoul

# 슬롯별 메시지 구성 (몇 건씩 담을지)
slots:
  morning:
    title: "🏃 오늘 아침 러닝 브리핑"
    articles: 3
    videos: 2
  evening:
    title: "🌙 퇴근길 러닝 브리핑"
    articles: 1
    videos: 4

# 한 번에 몇 시간 전까지의 항목을 후보로 볼지
lookback_hours: 36

# 한국어 번역·요약 (Claude API)
# ANTHROPIC_API_KEY 시크릿이 없으면 자동으로 건너뛰고 제목만 보냅니다.
summary:
  enabled: true
  # low | medium | high | xhigh | max — 번역·요약은 단순한 작업이라 low로 충분합니다.
  effort: low

# 링크 미리보기(썸네일). 첫 항목 하나만 보여준다 — 텔레그램은 메시지당
# 미리보기를 하나만 붙일 수 있다.
#   mode:       none | first
#   prefer:     video 면 영상 링크를 우선 (썸네일이 확실히 뜬다)
#               any 면 메시지 첫 항목을 그대로 사용
#   large:      true 면 큰 이미지, false 면 작은 썸네일
#   above_text: true 면 본문 위에 표시
# Google 뉴스 링크는 리다이렉트라 미리보기가 비는 일이 잦아 video 를 권한다.
# 그 회차에 영상이 없으면 기사 링크로 넘어간다.
link_preview:
  mode: first
  prefer: video
  large: true
  above_text: true

sources:
  # 구글 뉴스 RSS 검색. query 를 그대로 검색어로 씁니다.
  google_news:
    - name: 러닝·마라톤
      query: 러닝 OR 마라톤 OR 달리기
      lang: ko
      country: KR
    - name: 러닝 훈련·부상
      query: 러닝 훈련 OR 러닝 부상 OR 러닝화
      lang: ko
      country: KR

  # 일반 RSS 피드 (해외 매체)
  # 구독·큐레이션 채널 밖에서도 끌어온다. 48시간 안에 올라온 것 중
  # 조회수가 높은 순이라 '요즘 많이 본 러닝 영상'이 된다.
  youtube_search:
    - name: 러닝 인기 영상
      query: 러닝 OR 마라톤 OR 달리기
      order: viewCount
      lang: ko

  rss:
    - name: Runner's World
      url: https://www.runnersworld.com/rss/all.xml/
    - name: Running Magazine
      url: https://runningmagazine.ca/feed/
    - name: iRunFar
      url: https://www.irunfar.com/feed

  # 유튜브 채널.
  # channel_id 를 알면 그대로 쓰고, 모르면 url 에 채널 주소(@핸들)만 넣으세요.
  # 핸들은 자동으로 channel_id 로 변환되어 state/channels.json 에 캐시됩니다.
  # 세 가지 방법으로 채널을 지정할 수 있다. 결과는 state/channels.json 에 캐시된다.
  #
  #   1) channel_id 를 안다면 그대로:      channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
  #   2) 채널 주소만 알면:                  url: https://www.youtube.com/@handle
  #   3) 이름만 알면 (YOUTUBE_API_KEY 필요): name 만 적으면 검색해서 찾는다.
  #      다른 채널이 잡힐 수 있으니 로그의 "검색 → '찾은이름'" 을 확인한다.
  #      이름이 흔하면 search: 로 검색어를 따로 줄 수 있다.
  #
  # 예) 이름만으로 등록:
  #   - name: 런랜드
  #   - name: 김러너
  #     search: 김러너 러닝 마라톤
  youtube:
    # 국내 채널. 주소를 아는 곳은 url 로, 나머지는 이름 검색으로 찾는다.
    # 검색 결과는 로그의 "검색 → '찾은이름'" 으로 확인하고, 틀렸으면
    # state/channels.json 에서 해당 줄을 지운 뒤 search 를 좁히거나 url 을 넣는다.
    - name: 민티런
      url: https://www.youtube.com/@mintyrun
    - name: 마라닉TV
      search: 마라닉TV 러닝
    - name: 지니코치
      search: 지니코치 러닝 코치
    - name: 런소영
      search: 런소영 러닝
    - name: 션과 함께
      search: 션과 함께 러닝 마라톤
    - name: 한스
      search: 한스 HANS 러닝 마라톤
    - name: 러너임바
      search: 러너임바 러닝
    - name: 러닝전도사 안정은
      search: 러닝전도사 안정은
    - name: 정두식 마라톤TV
      search: 정두식 마라톤 TV
    - name: 메달사냥꾼
      search: 메달사냥꾼 Medal Hunter

    # 구독 목록(Takeout)에서 확인한 채널. channel_id 를 그대로 받았으므로
    # 검색을 거치지 않는다 — 엉뚱한 채널이 잡힐 여지가 없다.
    - name: 러닝라이프
      channel_id: UC1qXTVKyjjgD_vHuoA9EQ9A
    - name: 러너스하이
      channel_id: UCCrxoMgLv52UwMYQYTEVnvA
    - name: 보통러너 김보통
      channel_id: UCGoDwIDnCanX76eJiINnWbA
    - name: ND러너
      channel_id: UCj9v_ThF9C97nrraZKlxKfg
    - name: 진조크루
      channel_id: UCDQc4MIHU0XO8nirP2Cu27g
    - name: 엔듀로레이스
      channel_id: UCJ6Rc1WZXhl_zU_RIaTlQag
    - name: 헬스티비
      channel_id: UCvBD3Pf9xmqM9kSXjGv_6-A
    - name: 다이어트 과학자 최겸
      channel_id: UChXDq9Izwq-pTzeUWzwXL3A

    # 해외 채널
    # canonical 링크로 뽑은 ID가 RSS 200-0건, Data API 실패로 이어졌다.
    # 그 ID가 이 채널의 것이 아닌 것으로 보여 이름 검색으로 돌린다.
    - name: The Running Channel
      search: The Running Channel running
    - name: Ben Parkes
      url: https://www.youtube.com/@BenParkes
    - name: kofuzi
      url: https://www.youtube.com/@kofuzi
    - name: The Run Experience
      url: https://www.youtube.com/@TheRunExperience
    - name: Floris Gierman
      url: https://www.youtube.com/@FlorisGierman
    - name: Sage Canaday
      url: https://www.youtube.com/@Vo2maxProductions
    - name: Göran Winblad
      url: https://www.youtube.com/@GoranWinblad
    - name: Seth James DeMoor
      url: https://www.youtube.com/@SethJamesDeMoor

# 관심 키워드 가중치. 제목에 포함되면 점수가 올라가 우선 선택됩니다.
keywords:
  부상: 3
  통증: 3
  훈련: 2
  루틴: 2
  페이스: 2
  기록: 2
  마라톤: 2
  러닝화: 2
  스트레칭: 2
  초보: 1
  자세: 2
  호흡: 1
  injury: 3
  training: 2
  workout: 2
  pace: 2
  recovery: 2
  shoes: 2
  beginner: 1

# 제목에 포함되면 아예 제외 (대소문자 무시)
exclude:
  - 부고
  - 채용
  - 분양
  # 러닝 매체는 세일·쿠폰 글을 기사와 같은 피드로 내보낸다. 다이제스트에
  # 매트리스 할인 광고가 섞이지 않도록 걸러낸다.
  - 할인
  - 특가
  - 쿠폰
  - sale
  - deal
  - discount
  - coupon
  - prime day
  - black friday
