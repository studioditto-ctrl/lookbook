# 음식 다이제스트 (구독 채널 기반)
#
# 러닝 다이제스트와 같은 파이프라인을 쓰고, 상태만 state/food/ 로 분리된다.

timezone: Asia/Seoul

slots:
  # 점심 무렵 — 먹을거리
  lunch:
    title: "🍜 점심 뭐 먹지"
    articles: 1
    videos: 4

lookback_hours: 48

# 유튜브 영상 기준. 확인 못 한 값(비공개·요청 실패)은 통과시킨다.
youtube_filter:
  min_subscribers: 10000
  min_views: 5000

summary:
  enabled: true
  effort: low

link_preview:
  mode: first
  prefer: video
  large: true
  above_text: true

sources:
  google_news:
    - name: 맛집·미식
      query: 맛집 OR 미식 OR 레스토랑 신메뉴
      lang: ko
      country: KR

  youtube_search:
    - name: 맛집·요리 인기 영상
      query: 맛집 OR 요리 OR 레시피
      order: viewCount
      lang: ko

  rss: []

  # 구독 목록(Takeout)에서 확인한 channel_id. 검색을 거치지 않는다.
  youtube:
