      channel_id: UCBq9AjUsX1wjTSH1Eh2mpCA
    - name: 쿠킹하루
      channel_id: UCC8bTxyN2ZCfMzS_JAEClfA
    - name: JunsKitchen
      channel_id: UCRxAgfYexGLlu1WHGIMUDqw
    - name: 코리아요리아트아카데미
      channel_id: UCW2STcqZap2Znuamhb45b7Q
    - name: Stumptown Coffee Roasters
